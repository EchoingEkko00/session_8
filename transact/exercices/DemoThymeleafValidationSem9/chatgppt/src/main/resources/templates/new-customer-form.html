<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>New Customer Form</title>
</head>
<body>
<h1>New Customer Form</h1>
<form th:action="@{/saveCustomer}" th:object="${customer}" method="post">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" th:field="*{name}">
  <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Nom invalide</p>
  <br/>

  <label for="address">Address:</label>
  <input type="text" id="address" name="address" th:field="*{address}">
  <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" />
  <br/>

  <label for="phone">Phone:</label>
  <input type="text" id="phone" name="phone" th:field="*{phone}">
  <p th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" />
  <br/>

  <label for="email">Email:</label>
  <input type="text" id="email" name="email" th:field="*{email}">
  <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" />
  <br/>

  <label for="note">Note:</label>
  <input type="text" id="note" name="note" th:field="*{note}">
  <p th:if="${#fields.hasErrors('note')}" th:errors="*{note}" />
  <br/>
  <br/>
  <input type="submit" value="Submit">
</form>

<a th:href="@{customerList}">List users</a>

</body>
</html>
